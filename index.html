<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scan Ledger — Chartink Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #F2F4F7;
    --card: #FFFFFF;
    --ink: #1C2430;
    --muted: #6B7280;
    --rule: #E4E8EF;
    --navy: #0A2540;
    --blue: #0B63CE;
    --blue-tint: #EAF2FC;
    --green: #157A45;
    --red: #C93A2E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header {
    padding: 18px 32px;
    background: var(--navy);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }

  .masthead {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: #FFFFFF;
    line-height: 1;
  }

  .masthead .sub {
    display: block;
    font-weight: 500;
    font-size: 0.72rem;
    color: #9FB4CC;
    margin-top: 5px;
  }

  .date-select {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    background: #FFFFFF;
    color: var(--ink);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .date-select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    max-width: 1180px;
    margin: 24px auto;
    gap: 20px;
    padding: 0 32px;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; margin: 16px auto; padding: 0 16px; }
  }

  /* ---------- Sidebar (tabs) ---------- */
  .sidebar {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 8px 0;
    align-self: start;
  }

  .sidebar-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 20px 8px;
  }

  .tab {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    text-align: left;
    padding: 11px 20px;
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
  }

  .tab:hover { background: var(--blue-tint); }

  .tab.active {
    border-left-color: var(--blue);
    background: var(--blue-tint);
    color: var(--blue);
  }

  .tab-count {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    background: var(--rule);
    padding: 2px 8px;
    border-radius: 100px;
  }
  .tab.active .tab-count { color: #FFFFFF; background: var(--blue); }

  /* ---------- Main ---------- */
  main { min-width: 0; }

  .state {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 60px 0;
    text-align: center;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 8px;
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--rule);
    flex-wrap: wrap;
  }

  .panel-title {
    font-weight: 700;
    font-size: 1.05rem;
  }

  .stamp {
    font-size: 0.78rem;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 100px;
    background: var(--blue-tint);
    color: var(--blue);
    white-space: nowrap;
  }
  .stamp.none { background: var(--rule); color: var(--muted); }

  table.ledger {
    width: 100%;
    border-collapse: collapse;
  }

  table.ledger thead th {
    text-align: left;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    padding: 10px 20px;
    background: #FAFBFC;
    border-bottom: 1px solid var(--rule);
  }

  table.ledger tbody td {
    padding: 11px 20px;
    border-bottom: 1px solid var(--rule);
    font-size: 0.9rem;
  }

  table.ledger tbody tr:last-child td { border-bottom: none; }
  table.ledger tbody tr:hover td { background: var(--blue-tint); }

  td.rank {
    color: var(--muted);
    width: 48px;
    font-variant-numeric: tabular-nums;
  }

  td.symbol { font-weight: 600; }

  .sym-link {
    color: var(--blue);
    text-decoration: none;
  }
  .sym-link:hover { text-decoration: underline; }

  .empty-note {
    padding: 30px 20px;
    text-align: center;
    color: var(--muted);
    font-style: italic;
  }

  .pct-up { color: var(--green); font-weight: 600; }
  .pct-down { color: var(--red); font-weight: 600; }
  .pct-flat { color: var(--ink); }
  .pct-na { color: var(--muted); }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <div class="masthead">
    Scan Ledger
    <span class="sub" id="updated">loading…</span>
  </div>
  <select id="dateSelect" class="date-select">
    <option>loading dates…</option>
  </select>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-label">Scans</div>
  </nav>
  <main>
    <div id="content" class="state">Fetching latest scan…</div>
  </main>
</div>

<footer>Chartink screener results · updated daily via GitHub Actions</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ---- Fill this in with your Firebase project's web app config ----
  const firebaseConfig = {
  apiKey: "AIzaSyDoxMDKdMO1hQlFDuRh7-4X0D-gla1ZbiU",
  authDomain: "chartink-scanner-9d978.firebaseapp.com",
  projectId: "chartink-scanner-9d978",
  storageBucket: "chartink-scanner-9d978.firebasestorage.app",
  messagingSenderId: "177008142853",
  appId: "1:177008142853:web:67352cd2e49830574c4a6c"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const contentEl = document.getElementById('content');
  const updatedEl = document.getElementById('updated');
  const dateSelectEl = document.getElementById('dateSelect');
  const sidebarEl = document.getElementById('sidebar');

  let currentData = null;
  let activeScan = null;
  // Track sort state per-scan so sorting persists when switching scans
  const sortStates = {};
  // Cached returns from the latest scan doc (used to compute return since scan)
  let latestReturns = null;

  async function loadDateList() {
    try {
      const settingsResponse = await fetch("./settings.json");
      if (!settingsResponse.ok) {
        throw new Error(`Could not load settings.json (${settingsResponse.status})`);
      }
      const settings = await settingsResponse.json();
      const historyDays = settings.history_days;
      if (!Number.isInteger(historyDays) || historyDays < 1) {
        throw new Error("settings.json must define history_days as a positive integer");
      }

      const q = query(collection(db, "scans"), orderBy("date", "desc"), limit(historyDays + 1));
      const snap = await getDocs(q);

      const dates = snap.docs
        .filter(d => d.id !== 'latest')
        .map(d => d.data().date)
        .filter(Boolean)
        .slice(0, historyDays);

      if (!dates.length) {
        dateSelectEl.innerHTML = '<option>No data yet</option>';
        return;
      }

      dateSelectEl.innerHTML = dates
        .map((d, i) => `<option value="${d}">${d}${i === 0 ? ' (latest)' : ''}</option>`)
        .join('');

      dateSelectEl.addEventListener('change', () => loadScans(dateSelectEl.value));
    } catch (err) {
      console.error(err);
      dateSelectEl.innerHTML = '<option>Couldn\'t load dates</option>';
    }
  }

  // Fetch current/live prices for a list of symbols using Yahoo Finance (no API key)
  async function fetchLivePrices(symbols) {
    const uniq = Array.from(new Set((symbols || []).filter(Boolean)));
    if (!uniq.length) return {};
    // Yahoo expects NSE symbols with .NS suffix
    const q = uniq.map(s => encodeURIComponent(s + '.NS')).join(',');
    const url = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${q}`;
    try {
      const resp = await fetch(url);
      const json = await resp.json();
      const results = (json && json.quoteResponse && json.quoteResponse.result) || [];
      const map = {};
      results.forEach(r => {
        const full = r.symbol || '';
        const sym = full.replace(/\.NS$/i, '');
        if (r.regularMarketPrice != null) map[sym] = Number(r.regularMarketPrice);
      });
      return map;
    } catch (e) {
      console.warn('Live price fetch failed', e);
      return {};
    }
  }


  async function loadScans(dateId) {
    contentEl.className = 'state';
    contentEl.textContent = 'Fetching scan…';
    try {
      const docId = dateId || 'latest';
      const snap = await getDoc(doc(db, "scans", docId));

      if (!snap.exists()) {
        contentEl.textContent = "No scan data for this date.";
        updatedEl.textContent = "";
        sidebarEl.innerHTML = '<div class="sidebar-label">Scans</div>';
        return;
      }

      currentData = snap.data();
      activeScan = null;
      // Fetch the `latest` doc so we can compute returns from this scan date to the latest checking date.
      if (docId !== 'latest') {
        try {
          const latestSnap = await getDoc(doc(db, "scans", "latest"));
          latestReturns = latestSnap && latestSnap.exists() ? (latestSnap.data().returns || {}) : {};
        } catch (e) {
          console.warn('Could not load latest returns for comparison', e);
          latestReturns = {};
        }
      } else {
        latestReturns = currentData.returns || {};
      }

      render();
    } catch (err) {
      console.error(err);
      contentEl.textContent = "Couldn't load scan data. Check the Firebase config in this page and Firestore rules.";
      updatedEl.textContent = "";
    }
  }

  async function render() {
    updatedEl.textContent = currentData.timestamp || currentData.date || '';

    const scanEntries = Object.entries(currentData.scans || {}).map(([name, s]) => ({ name, s }));
    // Stable ordering: use explicit numeric `order` if provided, otherwise sort by name.
    scanEntries.sort((a, b) => {
      const oa = (a.s && typeof a.s.order === 'number') ? a.s.order : null;
      const ob = (b.s && typeof b.s.order === 'number') ? b.s.order : null;
      if (oa !== null && ob !== null) return oa - ob;
      if (oa !== null) return -1;
      if (ob !== null) return 1;
      return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
    });
    if (!scanEntries.length) {
      sidebarEl.innerHTML = '<div class="sidebar-label">Scans</div>';
      contentEl.className = 'state';
      contentEl.textContent = "No scans configured.";
      return;
    }

    if (!activeScan) activeScan = scanEntries[0].name;

    sidebarEl.innerHTML = '<div class="sidebar-label">Scans</div>' + scanEntries.map(({ name, s }) => {
      const count = s.count ?? (s.symbols || []).length;
      const isActive = name === activeScan;
      return `
        <button class="tab ${isActive ? 'active' : ''}" data-scan="${escapeHtml(name)}">
          <span>${escapeHtml(name)}</span>
          <span class="tab-count">${count}</span>
        </button>
      `;
    }).join('');

    sidebarEl.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeScan = btn.getAttribute('data-scan');
        render();
      });
    });

    await renderPanel(activeScan, currentData.scans[activeScan]);
  }

  function fmtPct(val) {
    if (val === null || val === undefined) return '<span class="pct-na">—</span>';
    const cls = val > 0 ? 'pct-up' : (val < 0 ? 'pct-down' : 'pct-flat');
    const sign = val > 0 ? '+' : '';
    const num = Number(val).toFixed(2);
    return `<span class="${cls}">${sign}${num}%</span>`;
  }

  async function renderPanel(name, s) {
    // Helper: attempt to find a comparison price in `latestReturns` for various symbol formats
    function findComparisonPrice(sym) {
      if (!latestReturns) return null;
      // direct lookup
      if (latestReturns[sym] && latestReturns[sym].price != null) return { price: Number(latestReturns[sym].price), key: sym };
      // try common variants
      const upper = sym.toUpperCase();
      const variants = [upper, upper + '.NS', 'NSE:' + upper, upper.replace(/[^A-Z0-9]/g, '')];
      for (const v of variants) {
        if (latestReturns[v] && latestReturns[v].price != null) return { price: Number(latestReturns[v].price), key: v };
      }
      // try fuzzy normalized match against all keys
      const norm = s => String(s).replace(/[^A-Z0-9]/gi, '').toUpperCase();
      const target = norm(sym);
      for (const k of Object.keys(latestReturns)) {
        if (!k) continue;
        if (norm(k) === target && latestReturns[k] && latestReturns[k].price != null) return { price: Number(latestReturns[k].price), key: k };
      }
      return null;
    }

    const symbols = s.symbols || [];
    // Fetch live/current prices (no fallback) and prefer them for comparison
    const liveMap = await fetchLivePrices(symbols);
    const count = s.count ?? symbols.length;
    const returnsMap = currentData.returns || {};

    // ensure a sort state exists for this scan
    if (!sortStates[name]) sortStates[name] = { key: null, dir: 'asc' };
    const state = sortStates[name];

    // Build items with metadata for stable sorting, including comparison price and return pct
    const items = symbols.map((sym, i) => {
      const r = returnsMap[sym] || {};
      const scanPrice = (r.price != null) ? Number(r.price) : null;
      const live = (liveMap && liveMap[sym] != null) ? Number(liveMap[sym]) : null;
      // No fallback: use live/current price only
      const comp = live !== null ? live : null;
      const compKey = comp !== null ? `${sym}.NS (live)` : null;
      const ret = (scanPrice != null && comp != null && scanPrice !== 0) ? ((comp - scanPrice) / scanPrice) * 100 : null;
      return { sym, i, r, scanPrice, comparisonPrice: comp, comparisonKey: compKey, ret };
    });

    // Apply sort if requested
    if (state.key) {
      const key = state.key;
      items.sort((a, b) => {
        let va, vb;
        switch (key) {
          case 'rank':
            va = a.i; vb = b.i; break;
          case 'symbol':
            return (a.sym).localeCompare(b.sym, undefined, { sensitivity: 'base' }) * (state.dir === 'asc' ? 1 : -1);
          case 'price':
            va = (a.r.price == null ? Number.NEGATIVE_INFINITY : Number(a.r.price));
            vb = (b.r.price == null ? Number.NEGATIVE_INFINITY : Number(b.r.price)); break;
          case 'day':
            va = (a.r.day == null ? Number.NEGATIVE_INFINITY : Number(a.r.day));
            vb = (b.r.day == null ? Number.NEGATIVE_INFINITY : Number(b.r.day)); break;
          case 'week':
            va = (a.r.week == null ? Number.NEGATIVE_INFINITY : Number(a.r.week));
            vb = (b.r.week == null ? Number.NEGATIVE_INFINITY : Number(b.r.week)); break;
          case 'month':
            va = (a.r.month == null ? Number.NEGATIVE_INFINITY : Number(a.r.month));
            vb = (b.r.month == null ? Number.NEGATIVE_INFINITY : Number(b.r.month)); break;
          case 'three_month':
            va = (a.r.three_month == null ? Number.NEGATIVE_INFINITY : Number(a.r.three_month));
            vb = (b.r.three_month == null ? Number.NEGATIVE_INFINITY : Number(b.r.three_month)); break;
          case 'ret':
            va = (a.ret == null ? Number.NEGATIVE_INFINITY : a.ret);
            vb = (b.ret == null ? Number.NEGATIVE_INFINITY : b.ret); break;
          default:
            va = 0; vb = 0;
        }
        if (va === undefined || vb === undefined) return 0;
        return (va - vb) * (state.dir === 'asc' ? 1 : -1);
      });
    }

    contentEl.className = '';
    contentEl.innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">${escapeHtml(name)}</div>
          <div class="stamp ${count ? '' : 'none'}">${count} match${count === 1 ? '' : 'es'}</div>
        </div>
        ${
          items.length
            ? `<table class="ledger">
                <thead>
                  <tr>
                    <th class="sortable" data-key="rank"># ${state.key==='rank' ? (state.dir==='asc' ? '▲' : '▼') : ''}</th>
                    <th class="sortable" data-key="symbol">Symbol ${state.key==='symbol' ? (state.dir==='asc' ? '▲' : '▼') : ''}</th>
                    <th class="sortable" data-key="price">Price ${state.key==='price' ? (state.dir==='asc' ? '▲' : '▼') : ''}</th>
                    <th class="sortable" data-key="ret">Return ${state.key==='ret' ? (state.dir==='asc' ? '▲' : '▼') : ''}</th>
                    <th class="sortable" data-key="day">Day ${state.key==='day' ? (state.dir==='asc' ? '▲' : '▼') : ''}</th>
                    <th class="sortable" data-key="week">1W ${state.key==='week' ? (state.dir==='asc' ? '▲' : '▼') : ''}</th>
                    <th class="sortable" data-key="month">1M ${state.key==='month' ? (state.dir==='asc' ? '▲' : '▼') : ''}</th>
                    <th class="sortable" data-key="three_month">3M ${state.key==='three_month' ? (state.dir==='asc' ? '▲' : '▼') : ''}</th>
                  </tr>
                </thead>
                <tbody>
                  ${items.map((it, i) => {
                    const r = it.r || {};
                    const scanPrice = it.scanPrice;
                    const compPrice = it.comparisonPrice;
                    const ret = it.ret;
                    let tip = 'Return since scan: N/A';
                    if (scanPrice != null && compPrice != null && scanPrice !== 0) {
                      tip = `${ret >= 0 ? '+' : ''}${ret.toFixed(2)}% (₹${scanPrice.toFixed(2)} → ₹${compPrice.toFixed(2)})`;
                      if (it.comparisonKey) tip += ` — key: ${it.comparisonKey}`;
                    } else if (scanPrice != null && compPrice == null) {
                      tip = `Scan price: ₹${scanPrice.toFixed(2)} (comparison price unavailable)`;
                      console.debug('No comparison price found for', it.sym);
                    } else if (scanPrice == null && compPrice != null) {
                      tip = `Comparison price: ₹${compPrice.toFixed(2)} (scan price unavailable)`;
                      if (it.comparisonKey) tip += ` — key: ${it.comparisonKey}`;
                    }

                                    return `<tr>
                      <td class="rank">${i + 1}</td>
                                      <td class="symbol"><a title="${escapeHtml(tip)}" class="sym-link" href="https://www.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(it.sym)}" target="_blank" rel="noopener">${escapeHtml(it.sym)}</a></td>
                                      <td>${r.price != null ? '₹' + r.price : '<span class="pct-na">—</span>'}</td>
                                      <td>${fmtPct(ret)}${it.comparisonKey ? ' <span style="font-size:0.75rem;color:var(--muted)">(' + escapeHtml(it.comparisonKey) + ')</span>' : ''}</td>
                      
                      <td>${fmtPct(r.day)}</td>
                      <td>${fmtPct(r.week)}</td>
                      <td>${fmtPct(r.month)}</td>
                      <td>${fmtPct(r.three_month)}</td>
                    </tr>`;
                  }).join('')}
                </tbody>
               </table>`
            : `<div class="empty-note">No stocks matched this scan on this date</div>`
        }
      </div>
    `;

    // Wire up sortable headers
    const ths = contentEl.querySelectorAll('th.sortable');
    ths.forEach(th => {
      th.style.cursor = 'pointer';
      th.addEventListener('click', () => {
        const key = th.getAttribute('data-key');
        const st = sortStates[name] || { key: null, dir: 'asc' };
        if (st.key === key) st.dir = st.dir === 'asc' ? 'desc' : 'asc';
        else { st.key = key; st.dir = 'asc'; }
        sortStates[name] = st;
        renderPanel(name, s);
      });
    });
  }

  // (No live toggle) 

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  loadDateList();
  loadScans();
</script>

</body>
</html>
