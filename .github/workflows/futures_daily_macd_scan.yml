name: Daily MACD Scanner (5 PM IST)
on:
  schedule:
    - cron: '0 11 * * 1-5'  # 5 PM IST Mon-Fri
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install packages
      run: |
        pip install requests beautifulsoup4 pandas
        
    - name: Run scanner
      env:
        EMAIL: ${{ secrets.EMAIL }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      run: python futures_daily_macd.py
        
    - name: Upload CSV
      uses: actions/upload-artifact@v4
      with:
        name: macd-symbols-${{ github.run_id }}
        path: macd_symbols.csv
