name: Daily Futures MACD Scanner (5 PM IST)
on:
  schedule:
    - cron: '0 11 * * 1-5'  # 5 PM IST Mon-Fri
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install packages + lxml
      run: |
        pip install requests beautifulsoup4 pandas lxml
        
    - name: Run Futures MACD Scanner
      env:
        EMAIL: ${{ secrets.EMAIL }}
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      run: python futures_daily_macd.py  # Your filename
