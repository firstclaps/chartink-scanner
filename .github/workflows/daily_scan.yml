name: Daily Scanner (5 PM IST)
on:
  schedule:
    - cron: '0 11 * * 1-5'  # 5 PM IST Mon-Fri
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install packages
      run: pip install -r requirements.txt

    - name: Run Scanner
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: python chartink_screener.py